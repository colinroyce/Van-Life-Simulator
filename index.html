<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Van Life Simulator</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="hud">
      <div id="help">
        <strong>Van Life Simulator</strong>
        <div id="help-drive">
          <div><kbd>W</kbd>/<kbd>↑</kbd> gas &nbsp; <kbd>S</kbd>/<kbd>↓</kbd> brake / reverse</div>
          <div><kbd>A</kbd>/<kbd>D</kbd> or <kbd>←</kbd>/<kbd>→</kbd> steer &nbsp; <kbd>Space</kbd> handbrake</div>
          <div><kbd>C</kbd> switch camera &nbsp; <kbd>E</kbd> get up (when stopped)</div>
          <div><kbd>R</kbd> reset &nbsp; <kbd>H</kbd> hide help</div>
        </div>
        <div id="help-walk" hidden>
          <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk &nbsp; <kbd>Shift</kbd> run</div>
          <div>Click to look with the mouse (<kbd>Esc</kbd> releases) &nbsp; <kbd>←</kbd>/<kbd>→</kbd> turn</div>
          <div><kbd>E</kbd> interact &nbsp; <kbd>H</kbd> hide help</div>
        </div>
      </div>
      <div id="gauge">
        <div id="speed">0</div>
        <div id="unit">MPH</div>
        <div id="gear">N</div>
      </div>
      <div id="crosshair" hidden></div>
      <div id="prompt" hidden></div>
      <div id="look-hint" hidden>Click to look around</div>
      <div id="cam-label"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
